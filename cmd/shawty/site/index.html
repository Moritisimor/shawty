<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Shawty</title>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <meta name="description" content=""/>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Shawty</h1>
    <h2>Free and Open Source URL Shortener</h2>
    <p><a href="https://github.com/Moritisimor/shawty">GitHub</a></p>

    <div class="area">
        <h2>Post your own Aliases for URLs</h2>
        
        <label for="aliasTextArea">Enter Alias</label> <br />
        <textarea id="aliasTextArea"></textarea> <br />

        <label for="urlTextArea">Enter URL</label> <br />
        <textarea id="urlTextArea"></textarea> <br />

        <button style="margin-top: 2%" id="sendButton">Send!</button>
    </div> <br />

    <script src="script.js"></script>
</body> 
</html>
